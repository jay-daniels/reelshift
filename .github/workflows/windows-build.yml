name: Windows executable
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ReelShift + PyInstaller
        run: python -m pip install . pyinstaller
      - name: Verify unit tests
        run: python -m unittest discover -s tests -v
      - name: Build single-file GUI
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ReelShift run.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReelShift-Windows
          path: dist/ReelShift.exe
          if-no-files-found: error
